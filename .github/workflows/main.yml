name: CI-CD pipeline

on:
  push:
    branches: ["develop"]
  workflow_dispatch:
env:
  TF_WORKING_DIR: ./k8s/cluster

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Getting the code
        uses: actions/checkout@4.2.2
      - name: running tests
        run: npm run test
      - name: lint analyses
        run: npm run lint
      - name: Authentication at docker hub
        uses: docker/login-action@3.4.0
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: building the docker image
        uses: docker/build-push-action@6.17.0
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: |
            yosepholiver/integra:v${{ github.run_number}}
            yosepholiver/integra:latest
  CD:
    runs-on: ubuntu-latest
    needs: [CI]
    steps:
    - name: Getting the code
      uses: actions/checkout@4.2.2
    - name: setting up the infrastructure
      uses: hashicorp/setup-terraform@v3 # Install Terraform CLI
      with:
          terraform_version: 1.12.20
    - name: Aws Configuring
      uses: aws-actions/configure-aws-credentials@v4.1.0
      with:
        aws-region: us-east-1
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
