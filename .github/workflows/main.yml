name: CI-CD pipeline

on:
  push:
    branches: ["develop"]
  workflow_dispatch:
env:
  TF_WORKING_DIR: ./k8s/cluster
  TERRAFORM_TOKEN_app_terraform_io: ${{ secrets.TERRAFORM_TOKEN_app_terraform_io }}
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Getting the code
        uses: actions/checkout@4.2.2
      - name: running tests
        run: npm install && npm run test
      - name: lint analyses
        run: npm run lint
      - name: Authentication at docker hub
        uses: docker/login-action@3.4.0
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{secrets.DOCKER_PASSWORD}}
      - name: building the docker image
        uses: docker/build-push-action@6.17.0
        with:
          context: ./
          file: ./Dockerfile
          push: true
          tags: |
            yosepholiver/integra:v${{ github.run_number}}
            yosepholiver/integra:latest
