apiVersion: apps/v1
kind: Deployment
metadata:
  name: integra
spec:
  selector:
    matchLabels:
      app: integra
  template:
    metadata:
      labels:
        app: integra
    spec:
      containers:
        - name: integra
          image: yosepholiver/integra:v1
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: integra-svc
spec:
  selector:
    app: integra
  ports:
    - port: 80
      targetPort: 3000
